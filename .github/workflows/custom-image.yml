# 把 fork 上的自定义 commit 自动 rebase 到上游，构建、冒烟测试通过后推送到 GHCR。
#
# 产物: ghcr.io/marszhongx/workbuddy2api-hub:latest（多架构 amd64+arm64，另打 SHA 标签去重）。
# 两个平台各自用原生 runner 构建，最后由 merge job 合成 manifest。
# rebase 冲突或冒烟失败时这个 job 会失败并通知，需要人工处理一次。
name: Build custom image

on:
  schedule:
    # 每 6 小时跟进一次上游
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: custom-image
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 用原生 arm runner；Windows x64 用原生 amd64 runner
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto upstream
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ardeyouxipianyi/workbuddy2api-hub.git
          git fetch --no-tags upstream '+refs/heads/main:refs/remotes/upstream/main'
          git rebase upstream/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 上游没更新时 rebase 不会改动 commit，用 SHA+架构 标签判断是否已经构建过，
      # 避免每 6 小时重复推送一个内容相同的镜像（否则本地每次 pull 都要重新下载）。
      - name: Check whether this commit is already built
        id: check
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ steps.rebase.outputs.sha }}
        run: |
          if docker manifest inspect "$IMAGE:$SHA-${{ matrix.arch }}" >/dev/null 2>&1; then
            echo "已构建过 $SHA-${{ matrix.arch }}，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.arch }}
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.rebase.outputs.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 只在 arm64（原生）上冒烟：干净数据目录跑起来，能启动、面板能打开、
      # /v1 鉴权生效，才算通过。坏镜像不会进入多架构 manifest。
      - name: Smoke test
        if: matrix.arch == 'arm64' && steps.check.outputs.skip == 'false'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ steps.rebase.outputs.sha }}
        run: |
          docker pull "$IMAGE:$SHA-arm64"
          mkdir -p "$RUNNER_TEMP/smoke/accounts" "$RUNNER_TEMP/smoke/usage"
          docker run -d --name wb-proxy-smoke \
            -p 127.0.0.1:18088:8788 \
            -e API_KEY=smoke \
            -e TZ=Asia/Shanghai \
            -v "$RUNNER_TEMP/smoke/accounts:/app/accounts" \
            -v "$RUNNER_TEMP/smoke/usage:/app/usage" \
            "$IMAGE:$SHA-arm64"

          healthy=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:18088/health >/dev/null 2>&1; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            echo "::error::镜像启动后 60s 内没有通过 /health"
            docker logs wb-proxy-smoke || true
            exit 1
          fi

          page=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18088/)
          [ "$page" = 200 ] || { echo "::error::面板 / 返回 $page"; docker logs wb-proxy-smoke; exit 1; }

          # 401 = /v1/models 路由已注册且鉴权生效（不带 key 不该放行）
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18088/v1/models)
          [ "$api" = 401 ] || { echo "::error::/v1/models 返回 $api"; docker logs wb-proxy-smoke; exit 1; }

          echo "冒烟测试通过"

      - name: Clean up the smoke container
        if: always()
        run: docker rm -f wb-proxy-smoke >/dev/null 2>&1 || true

      # 把 rebase 结果推回分支，保证 main 永远只领先上游一个 commit。
      # 上游改了 .github/workflows/* 时，GITHUB_TOKEN 没有 workflows 权限、推不动；
      # 配了带 workflow scope 的 PAT（secrets.SYNC_TOKEN）就用它，否则只告警不失败
      # ——镜像已经构建并推送成功，分支镜像落后不影响使用。
      - name: Keep the fork in sync
        if: matrix.arch == 'arm64' && steps.rebase.outputs.sha != github.sha
        env:
          SHA: ${{ steps.rebase.outputs.sha }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${SYNC_TOKEN:-${{ github.token }}}@github.com/${{ github.repository }}.git"
          if git push --force-with-lease "$REMOTE" main; then
            echo "已把 $SHA 推回 main"
          else
            echo "::warning::推回 main 失败（GITHUB_TOKEN 无权更新 workflow 文件）；在仓库 secrets 里配置带 workflow scope 的 SYNC_TOKEN 即可自动同步"
          fi

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 分支 head 就是两个平台构建时用的 commit（arm64 已经把 rebase 结果推回来了）
      - name: Publish multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          SHA="$(git rev-parse HEAD)"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHA" \
            "$IMAGE:$SHA-amd64" \
            "$IMAGE:$SHA-arm64"
          echo "已发布 $IMAGE:latest 和 $IMAGE:$SHA（amd64 + arm64）"
